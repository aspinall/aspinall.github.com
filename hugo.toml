baseURL = 'https://aspinall.github.io'
languageCode = 'en-us'
title = "Craig Aspinall's Technical Blog"

[params]
  description = "A technical blog focused on building software products using AI tooling and related topics, providing practical insights and real-world experiences."
  author = "Craig Aspinall"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = "github"
    lineNos = true
    tabWidth = 2

[menu]
  [[menu.main]]
    name = "Home"
    url = "/"
    weight = 10
  [[menu.main]]
    name = "About"
    url = "/about/"
    weight = 20
  [[menu.main]]
    name = "Posts"
    url = "/posts/"
    weight = 30

# Enable RSS feed
enableRSSFeed = true

# Pagination
paginate = 10
